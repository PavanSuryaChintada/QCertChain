[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence"
version = "0.1.0"
description = "Evidence bundles: SHA-256 Merkle root over sorted artifacts, Ed25519 signature, verification that names the failing artifact."
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["pynacl==1.5.0"]

[tool.setuptools.packages.find]
where = ["src"]
