name: ci

on:
  push:
    branches: [main]
  pull_request:

# Hardhat's well-known TEST accounts #1 and #2 (public; they only ever sign on the throwaway CI chain).
env:
  CI: "true"
  TEST_DATABASE_URL: postgresql+psycopg://qcertchain:qcertchain@localhost:5433/qcertchain_test
  TEST_CHAIN_RPC: http://127.0.0.1:8546
  ORG_PRIVATE_KEY: "0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d"
  ORG2_PRIVATE_KEY: "0x5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a"

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: qcertchain
          POSTGRES_PASSWORD: qcertchain
          POSTGRES_DB: qcertchain_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U qcertchain" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: "services/api/requirements*.txt"}
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: Install Python dependencies
        run: pip install -r services/api/requirements.txt -r services/api/requirements-quantum.txt
      - name: Allowlist (Tranco top 100k)
        run: python -m scripts.fetch_allowlist
      - name: Local chain (Hardhat) with the contracts deployed
        working-directory: contracts
        run: |
          npm ci --no-audit --no-fund
          npx hardhat node --hostname 127.0.0.1 --port 8546 > hardhat.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -X POST -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' http://127.0.0.1:8546 && break; sleep 1; done
          CHAIN_RPC=http://127.0.0.1:8546 npx hardhat run scripts/deploy.ts --network localhost
      - name: Tests (includes tenancy, the on-chain consortium check, and the latency budgets)
        run: python -m pytest -q -p no:cacheprovider -m "not network"
      - name: Latency report
        if: always()
        run: cat reports/api_latency.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: api-latency, path: reports/api_latency.json, if-no-files-found: ignore}

  console:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: {run: {working-directory: apps/console}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx vitest run

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: {run: {working-directory: contracts}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: npm ci --no-audit --no-fund
      - run: npx hardhat test
