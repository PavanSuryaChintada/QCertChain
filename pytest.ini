[pytest]
testpaths = services/tests packages/interdict/tests packages/evidence/tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    db: needs TEST_DATABASE_URL postgres
    network: touches the internet
    quantum: needs qiskit
    chain: needs a running hardhat node
    perf: latency budgets against seeded data (T12)
    e2e: browser click-through of DEMO.md (run via scripts/e2e_stack.py)
filterwarnings =
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
