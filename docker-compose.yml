# QCertChain — local and demo infrastructure.
# Database: Supabase (DATABASE_URL in .env, session pooler — IPv4). No local Postgres for the app.
#   docker compose up -d redis certstream hardhat     # infrastructure
#   docker compose up -d                              # everything
#   docker compose --profile test up -d postgres-test # local Postgres for the test suite only
name: qcertchain

x-app: &app
  build: {context: ., dockerfile: services/api/Dockerfile}
  env_file: [.env]
  environment:
    REDIS_URL: redis://redis:6379
    CERTSTREAM_URL: ws://certstream:8080/
    CHAIN_RPC: http://hardhat:8545
    EVIDENCE_DIR: /data/evidence
  volumes: ["./data:/app/data"]
  depends_on:
    redis: {condition: service_healthy}
  restart: unless-stopped

services:
  certstream:
    image: 0rickyy0/certstream-server-go:v1.10.1
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./data/certstream:/app/config:ro"]
    restart: unless-stopped
    # v1.10.1: #104 partial-tile fix + #114 off-by-one. recovery off (see data/certstream/config.yaml).

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    # noeviction is deliberate: silently dropping queued certificates under memory pressure
    # would corrupt the pipeline invisibly

  hardhat:
    build: {context: ./contracts, dockerfile: Dockerfile}
    ports: ["127.0.0.1:8545:8545"]
    restart: unless-stopped
    # the image starts the node AND deploys the contracts on boot (contracts/Dockerfile). A fresh node
    # always yields the addresses committed in contracts/deployments/localhost.json.

  api:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]
    command: uvicorn services.api.main:app --host 0.0.0.0 --port 8000
    shm_size: 1gb

  ingest:
    <<: *app
    command: python -m services.ingest.stream
    # ONE replica only: several consumers of the same CT stream duplicate work, they do not shard it.

  triage:
    <<: *app
    command: python -m services.api.workers.triage_worker
    # scale with replicas if lag grows: workers share the Redis consumer group

  enrich:
    <<: *app
    command: python -m services.api.workers.enrich_worker
    shm_size: 1gb   # Chromium crashes on the default 64 MB

  anchor:
    <<: *app
    command: python -m services.api.workers.anchor_worker
    depends_on:
      redis: {condition: service_healthy}
      hardhat: {condition: service_started}

  postgres-test:
    image: postgres:17-alpine
    profiles: [test]
    environment: {POSTGRES_USER: qcertchain, POSTGRES_PASSWORD: qcertchain, POSTGRES_DB: qcertchain_test}
    ports: ["127.0.0.1:5433:5432"]
    tmpfs: [/var/lib/postgresql/data]
    # tests only — the app database is Supabase (spec D7)

volumes:
  redisdata:
