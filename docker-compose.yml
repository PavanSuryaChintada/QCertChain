# QCertChain — local and demo infrastructure
# Bring up:  docker compose up -d redis certstream   (DB is Supabase)
# Full:      docker compose up -d
name: qcertchain

services:
  certstream:
    image: 0rickyy0/certstream-server-go:v1.10.1
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./data/certstream:/app/config"]
    restart: unless-stopped
    # v1.10.1: #104 partial-tile fix + #114 off-by-one. recovery off (see config).


  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    # noeviction is deliberate: silently dropping queued certificates
    # under memory pressure would corrupt the pipeline invisibly

  api:
    build: {context: ., dockerfile: services/api/Dockerfile}
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379
    ports: ["8000:8000"]
    depends_on:
      redis: {condition: service_healthy}
    volumes: ["./data:/data"]
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  ingest:
    build: {context: ., dockerfile: services/api/Dockerfile}
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis: {condition: service_healthy}
    volumes: ["./data:/data"]
    command: python -m services.ingest.stream
    restart: unless-stopped
    # ONE replica only. Multiple consumers on the same CT stream
    # duplicate work, they do not shard it.

  triage:
    build: {context: ., dockerfile: services/api/Dockerfile}
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis: {condition: service_healthy}
    volumes: ["./data:/data"]
    command: python -m services.api.workers.triage_worker
    restart: unless-stopped

  enrich:
    build: {context: ., dockerfile: services/api/Dockerfile}
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis: {condition: service_healthy}
    volumes: ["./data:/data"]
    command: python -m services.api.workers.enrich_worker
    deploy: {replicas: 4}
    restart: unless-stopped
    shm_size: 1gb
    # shm_size matters: Chromium crashes on the default 64MB

  hardhat:
    build: {context: ./contracts, dockerfile: Dockerfile}
    ports: ["8545:8545"]
    command: npx hardhat node --hostname 0.0.0.0
    restart: unless-stopped

  postgres-test:
    image: postgres:17-alpine
    profiles: [test]
    environment: {POSTGRES_USER: qcertchain, POSTGRES_PASSWORD: qcertchain, POSTGRES_DB: qcertchain_test}
    ports: ["127.0.0.1:5433:5432"]
    tmpfs: [/var/lib/postgresql/data]
    # tests only — the app database is Supabase (spec D7)

volumes:
  redisdata:
