# QCertChain brand list — drives triage (TRD §2, DATA.md §4).
# tokens: lowercase alphanumerics, unique across brands. Tokens of <= 3 chars match only a
# whole hyphen/dot/digit-delimited segment (triage), never a substring.
# legit_domains: the brand's real registrable domains. Every entry is DNS-verified by
# scripts/verify_brands.py; anything unverified is omitted and listed in data/MANIFEST.md.

